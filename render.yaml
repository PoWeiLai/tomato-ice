# Render 部署設定。到 Render 按 New → Blueprint → 選這個 repo，會自動照這份建立服務。
services:
  - type: web
    name: tomato-ice-order
    runtime: node
    plan: free          # 免費方案：15 分鐘沒流量會休眠，喚醒約 1 分鐘，且沒有永久硬碟
    region: singapore   # Render 沒有台灣機房，新加坡離台灣最近
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      # 店員密碼：建 Blueprint 時 Render 會問，填 4～8 位數字（手機登入用數字鍵盤）；之後可在後台「今日報表」頁改。
      # 這個 repo 是公開的，所以密碼不寫在檔案裡。
      - key: STAFF_PIN
        sync: false
      # OWNER_PHONE 可不設：老闆手機建議直接在後台「今日報表」→「老闆手機」登記，
      # 忘記密碼時輸入這支號碼就能自助重設。
      # 資料存在 Turso（雲端 SQLite），主機沒有硬碟也不會掉訂單和照片。
      # 這兩個值是機密，不寫在檔案裡：建 Blueprint 時 Render 會問，或到服務的 Environment 頁手動加。
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # PUBLIC_URL 不用設：程式會自動讀 Render 給的 RENDER_EXTERNAL_URL，
      # QRcode 就會指向正確的線上網址。
      # 試用期限：不設就是程式內定的 2026-09-30 當天結束，之後整站鎖住。
      # 要延長就填 2026-10-31 這種日期；正式交付（不再限期）就填 0。
      # 這是給部署的人用的，店家在後台改不到。
      - key: TRIAL_END
        sync: false
