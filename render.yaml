# Render 部署設定。到 Render 按 New → Blueprint → 選這個 repo，會自動照這份建立服務。
services:
  - type: web
    name: restaurant-order
    runtime: node
    plan: free          # 免費方案：15 分鐘沒流量會休眠，喚醒約 1 分鐘，且沒有永久硬碟
    region: singapore   # Render 沒有台灣機房，新加坡離台灣最近
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: STAFF_PIN
        value: "882266"   # 只能用數字（手機登入用數字鍵盤）；也可以之後在後台「今日報表」頁改
      # PUBLIC_URL 不用設：程式會自動讀 Render 給的 RENDER_EXTERNAL_URL，
      # QRcode 就會指向正確的線上網址。
